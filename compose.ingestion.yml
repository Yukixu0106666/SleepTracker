services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sleeptracker
      POSTGRES_PASSWORD: sleeptracker_dev
      POSTGRES_DB: sleeptracker
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - sleeptracker-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sleeptracker -d sleeptracker"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  sleeptracker-postgres:
